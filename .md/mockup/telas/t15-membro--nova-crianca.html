<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T15 Membro · adicionar criança (formulário)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body class="gestao">
<div class="layout">
  <nav class="barra-nav" aria-label="Principal">
    <span class="marca">Tarefas da Casa</span>
    <ul>
      <li><a href="t06-hoje--sucesso-responsavel.html"><span class="icone i-hoje" aria-hidden="true"></span>Hoje</a></li>
      <li><a href="t08-casa--sucesso.html"><span class="icone i-casa" aria-hidden="true"></span>Casa</a></li>
      <li><a href="t11-gerenciar--sucesso.html" aria-current="page"><span class="icone i-gerenciar" aria-hidden="true"></span>Gerenciar</a></li>
      <li><a href="t10-eu--sucesso.html"><span class="icone i-eu" aria-hidden="true"></span>Eu</a></li>
    </ul>
  </nav>
  <main class="principal">
    <header class="cabecalho cabecalho--voltar">
      <a class="botao-voltar" href="t14-familia--sucesso.html" aria-label="Voltar para Família"><span class="icone i-voltar" aria-hidden="true"></span></a>
      <h1>Adicionar criança</h1>
    </header>
    <form class="formulario" novalidate>
      <div class="campo">
        <label for="apelido">Apelido</label>
        <input id="apelido" type="text" maxlength="20" aria-describedby="apelido-ajuda">
        <p class="ajuda" id="apelido-ajuda">De 1 a 20 caracteres.</p>
      </div>
      <fieldset class="campo">
        <legend>Avatar</legend>
        <div class="seletor-avatar">
          <label><input type="radio" name="avatar" value="estrela" checked><img class="avatar" src="../avatares/estrela.svg" alt="Estrela"></label>
          <label><input type="radio" name="avatar" value="sol"><img class="avatar" src="../avatares/sol.svg" alt="Sol"></label>
          <label><input type="radio" name="avatar" value="lua"><img class="avatar" src="../avatares/lua.svg" alt="Lua"></label>
          <label><input type="radio" name="avatar" value="flor"><img class="avatar" src="../avatares/flor.svg" alt="Flor"></label>
          <label><input type="radio" name="avatar" value="folha"><img class="avatar" src="../avatares/folha.svg" alt="Folha"></label>
          <label><input type="radio" name="avatar" value="foguete"><img class="avatar" src="../avatares/foguete.svg" alt="Foguete"></label>
          <label><input type="radio" name="avatar" value="peixe"><img class="avatar" src="../avatares/peixe.svg" alt="Peixe"></label>
          <label><input type="radio" name="avatar" value="gato"><img class="avatar" src="../avatares/gato.svg" alt="Gato"></label>
          <label><input type="radio" name="avatar" value="nuvem"><img class="avatar" src="../avatares/nuvem.svg" alt="Nuvem"></label>
          <label><input type="radio" name="avatar" value="coracao"><img class="avatar" src="../avatares/coracao.svg" alt="Coração"></label>
          <label><input type="radio" name="avatar" value="raio"><img class="avatar" src="../avatares/raio.svg" alt="Raio"></label>
          <label><input type="radio" name="avatar" value="planeta"><img class="avatar" src="../avatares/planeta.svg" alt="Planeta"></label>
        </div>
      </fieldset>
      <button class="botao botao--principal botao--bloco" type="submit">Salvar</button>
    </form>
  </main>
</div>
</body>
</html>
