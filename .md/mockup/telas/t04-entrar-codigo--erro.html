<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T04 Entrar com código · erro (inválido ou expirado)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<div class="layout layout--simples">
  <main class="principal">
    <header class="cabecalho cabecalho--voltar">
      <a class="botao-voltar" href="t01-entrada--sucesso.html" aria-label="Voltar"><span class="icone i-voltar" aria-hidden="true"></span></a>
      <h1>Entrar com código</h1>
    </header>
    <form class="formulario" novalidate>
      <div class="campo campo-codigo campo--erro">
        <label for="codigo">Código</label>
        <p class="ajuda" id="codigo-ajuda">Peça o código a um responsável.</p>
        <input id="codigo" type="text" value="K7MP-3RXV" maxlength="9" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" aria-invalid="true" aria-describedby="codigo-erro codigo-ajuda">
        <p class="erro" id="codigo-erro" role="alert"><span class="icone icone--pequeno i-alerta" aria-hidden="true"></span>Código inválido ou expirado. Peça um novo a um responsável.</p>
      </div>
      <button class="botao botao--principal botao--bloco" type="submit">Entrar</button>
    </form>
  </main>
</div>
</body>
</html>
