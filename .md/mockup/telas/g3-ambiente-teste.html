<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G3 Faixa "AMBIENTE DE TESTE" (sobre T06 Hoje)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<p class="faixa-teste" role="note">AMBIENTE DE TESTE</p>
<div class="layout layout--hoje">
  <nav class="barra-nav" aria-label="Principal">
    <span class="marca">Tarefas da Casa</span>
    <ul>
      <li><a href="t06-hoje--sucesso.html" aria-current="page"><span class="icone i-hoje" aria-hidden="true"></span>Hoje</a></li>
      <li><a href="t08-casa--sucesso.html"><span class="icone i-casa" aria-hidden="true"></span>Casa</a></li>
      <li><a href="t10-eu--sucesso.html"><span class="icone i-eu" aria-hidden="true"></span>Eu</a></li>
    </ul>
  </nav>
  <main class="principal">
    <header class="cabecalho">
      <div><h1>Hoje</h1><p class="data">sexta, 16 de outubro</p></div>
      <img class="avatar avatar--m" src="../avatares/estrela.svg" alt="Bia">
    </header>
    <section class="faixa-placar" aria-label="Placar da semana">
      <p class="placar-texto"><span>Semana até agora:</span> <strong>75%</strong></p>
      <div class="placar-barra" role="progressbar" aria-label="Semana até agora" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75"><span style="width:75%"></span></div>
    </section>
    <section class="secao" aria-labelledby="s-voce">
      <h2 id="s-voce">Para você</h2>
      <ul class="lista">
        <li class="item-ocorrencia">
          <div class="item-texto"><span class="item-nome">Regar as plantas</span><span class="rotulo-tempo"><span class="icone icone--pequeno i-relogio" aria-hidden="true"></span>Ficou de ontem</span></div>
          <div class="item-acoes"><button class="botao-mais" type="button" aria-label="Mais opções para Regar as plantas"><span class="icone i-mais" aria-hidden="true"></span></button><button class="botao-feito" type="button" aria-label="Feito: Regar as plantas"><span class="icone i-feito" aria-hidden="true"></span>Feito</button></div>
        </li>
        <li class="item-ocorrencia">
          <div class="item-texto"><span class="item-nome">Arrumar a cama</span></div>
          <div class="item-acoes"><button class="botao-mais" type="button" aria-label="Mais opções para Arrumar a cama"><span class="icone i-mais" aria-hidden="true"></span></button><button class="botao-feito" type="button" aria-label="Feito: Arrumar a cama"><span class="icone i-feito" aria-hidden="true"></span>Feito</button></div>
        </li>
        <li class="item-ocorrencia">
          <div class="item-texto"><span class="item-nome">Guardar os brinquedos</span></div>
          <div class="item-acoes"><button class="botao-mais" type="button" aria-label="Mais opções para Guardar os brinquedos"><span class="icone i-mais" aria-hidden="true"></span></button><button class="botao-feito" type="button" aria-label="Feito: Guardar os brinquedos"><span class="icone i-feito" aria-hidden="true"></span>Feito</button></div>
        </li>
      </ul>
    </section>
  </main>
