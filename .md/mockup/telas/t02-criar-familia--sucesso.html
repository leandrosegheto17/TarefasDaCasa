<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T02 Criar família · formulário</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
</head>
<body>
<div class="layout layout--simples">
  <main class="principal">
    <header class="cabecalho cabecalho--voltar">
      <a class="botao-voltar" href="t01-entrada--primeiro-uso.html" aria-label="Voltar"><span class="icone i-voltar" aria-hidden="true"></span></a>
      <h1>Criar família</h1>
    </header>
    <form class="formulario" novalidate>
      <div class="campo"><label for="nome-familia">Nome da família</label><input id="nome-familia" type="text" maxlength="40" autocomplete="off"></div>
      <div class="campo"><label for="apelido">Seu apelido</label><input id="apelido" type="text" maxlength="20" autocomplete="nickname"></div>
      <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email"></div>
      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha"><input id="senha" type="password" autocomplete="new-password" aria-describedby="senha-ajuda"><button class="mostrar" type="button" aria-label="Mostrar senha" aria-pressed="false"><span class="icone i-olho" aria-hidden="true"></span></button></div>
        <p class="ajuda" id="senha-ajuda">Pelo menos 8 caracteres.</p>
      </div>
      <div class="campo">
        <label for="codigo-instalacao">Código de instalação</label>
        <input id="codigo-instalacao" type="text" autocomplete="off" autocapitalize="off" aria-describedby="ci-ajuda">
        <p class="ajuda" id="ci-ajuda">Está nas configurações do servidor. Só é pedido desta vez.</p>
      </div>
      <button class="botao botao--principal botao--bloco" type="submit">Criar família</button>
    </form>
  </main>
</div>
</body>
</html>
